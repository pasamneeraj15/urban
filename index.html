<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>City Growers</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="navbar">
<div class="logo">
<img src="img.jpg" alt="Logo">
<span>City <br> Growers</span>
</div>

<ul class="menu">
<li><a href="web.html">Home</a></li>
<li><a href="blog.html">Blog</a></li>
<li><a href="about.html">About</a></li>
<li><a href="contact.html">Contact</a></li>
<li><a href="login.html" class="login-btn">Log In</a></li>
</ul>
</nav>
<div class="content">
<img src="img1.jpg" alt="urban farming">

<div class="text">
<h1>Urban <br> Farming <br> Blog</h1>
</div>
</div>

<section class="login-section" id="loginBox">
<form id="loginForm" class="login-form" onsubmit="handleLogin(event)">
<div id="loginMessage" class="form-message" role="status"></div>
<h2>Login</h2>

<input type="email" name="email" placeholder="Email" required>
<input type="password" name="password" placeholder="Password" required>

<button type="submit">Login</button>

<p class="register-link">
Don't have an account?
<a href="#" onclick="event.preventDefault(); openregister();">Register</a>
</p>

</form>
</section>

<section class="form-section" id="registerBox">
<form id="registerForm" class="register-form" onsubmit="handleRegister(event)">

<div id="formMessage" class="form-message" role="status"></div>
<h2>Register</h2>

<input type="text" name="fullName" placeholder="Full Name" required>
<input type="email" name="email" placeholder="Email" required>
<input type="password" name="password" placeholder="Password" required>
<input type="password" name="confirmPassword" placeholder="Confirm Password" required>

<button type="submit">Create Account</button>

<p class="switch-link">
Already have an account?
<a href="#" onclick="event.preventDefault(); openlogin();">Login</a>
</p>
</form>
</section>

<script>

function openlogin(){
document.getElementById("loginBox").style.display="block";
document.getElementById("registerBox").style.display="none";
}

function openregister(){
document.getElementById("registerBox").style.display="block";
document.getElementById("loginBox").style.display="none";
}

const API_BASE = 'http://localhost:3000';

async function handleRegister(event){
  event.preventDefault();
  const form = event.target;
  const messageBox = document.getElementById("formMessage");
  const data = Object.fromEntries(new FormData(form).entries());

  messageBox.textContent = "Processing...";
  messageBox.className = "form-message";

  try {
    const response = await fetch(`${API_BASE}/register`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });

    const result = await response.json();
    messageBox.textContent = result.message || "Registration successful.";
    messageBox.className = response.ok ? "form-message success" : "form-message error";

    if (response.ok) {
      form.reset();
    }
  } catch (error) {
    messageBox.textContent = "Registration failed. Please try again.";
    messageBox.className = "form-message error";
  }
}

async function handleLogin(event){
  event.preventDefault();
  const form = event.target;
  const messageBox = document.getElementById("loginMessage");
  const data = Object.fromEntries(new FormData(form).entries());

  messageBox.textContent = "Checking...";
  messageBox.className = "form-message";

  try {
    const response = await fetch(`${API_BASE}/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });

    const result = await response.json();
    messageBox.textContent = result.message || "Login successful.";
    messageBox.className = response.ok ? "form-message success" : "form-message error";

    if (response.ok) {
      form.reset();
    }
  } catch (error) {
    messageBox.textContent = "Login failed. Please try again.";
    messageBox.className = "form-message error";
  }
}
</script>

</body>
</html>
