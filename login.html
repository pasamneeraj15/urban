<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | City Growers</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <div class="auth-shell">
    <a class="back-link" href="index.html">← Back to home</a>
    <div class="auth-card">
      <h1>Welcome back</h1>
      <p>Log in to keep growing your urban farming ideas.</p>

      <div id="loginMessage" class="form-message" role="status"></div>

      <form id="loginForm" class="auth-form" onsubmit="handleLogin(event)">
        <label>
          <span>Email</span>
          <input type="email" name="email" placeholder="you@example.com" required>
        </label>

        <label>
          <span>Password</span>
          <div class="password-wrap">
            <input type="password" name="password" placeholder="Enter your password" required>
            <span class="toggle-password" onclick="togglePassword(this)" aria-label="Show password">👁</span>
          </div>
        </label>

        <button class="primary-btn" type="submit">Login</button>
      </form>

      <p class="auth-switch">
        New here? <a href="register.html">Create an account</a>
      </p>
    </div>
  </div>

  <script>
    const API_BASE = window.location.origin;

    function togglePassword(button) {
      const wrapper = button.closest('.password-wrap');
      const input = wrapper?.querySelector('input');
      if (!input) return;
      const isPassword = input.type === 'password';
      input.type = isPassword ? 'text' : 'password';
      button.textContent = isPassword ? '🙈' : '👁';
      button.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
    }

    async function handleLogin(event) {
      event.preventDefault();
      const form = event.target;
      const messageBox = document.getElementById('loginMessage');
      const data = Object.fromEntries(new FormData(form).entries());

      messageBox.textContent = 'Checking your account...';
      messageBox.className = 'form-message';

      try {
        const response = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });

        const result = await response.json();
        messageBox.textContent = result.message || 'Login successful.';
        messageBox.className = response.ok ? 'form-message success' : 'form-message error';

        if (response.ok) {
          form.reset();
        }
      } catch (error) {
        console.error('Login request error:', error);
        messageBox.textContent = 'Login failed. Please make sure the server is running and try again.';
        messageBox.className = 'form-message error';
      }
    }
  </script>
</body>
</html>
